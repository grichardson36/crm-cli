version: 2

# Release assets, as INSTALL.md expects them:
#   crm_<os>_<arch>.tar.gz   (crm_windows_<arch>.zip on Windows)   os: linux, darwin, windows   arch: amd64, arm64
#   checksums.txt            SHA-256 of every archive
project_name: crm

builds:
  - main: ./cmd/crm
    binary: crm
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # cmd/crm/main.go copies main.version into cli.Version, so the flag must target main.version.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - AGENTS.md
      - INSTALL.md

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

checksum:
  name_template: 'checksums.txt'

brews:
  - repository:
      owner: jdanielnd
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # The tap belongs to the upstream project. Generate the formula but do not push it.
    skip_upload: true
    name: crm
    directory: Formula
    homepage: "https://github.com/jdanielnd/crm-cli"
    description: "Local-first personal CRM for the terminal"
    license: "MIT"
    install: |
      bin.install "crm"
    test: |
      system "#{bin}/crm", "--version"
